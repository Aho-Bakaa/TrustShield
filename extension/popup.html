<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrustShield</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:system-ui,-apple-system,sans-serif; width:340px; background:#fff; color:#1e293b; }
    .header { display:flex; align-items:center; gap:10px; padding:14px 16px; background:#0f4c81; color:#fff; border-bottom:2px solid #0d3760; }
    .header h1 { font-size:14px; font-weight:700; margin:0; }
    .header .sub { font-size:9px; text-transform:uppercase; letter-spacing:1px; opacity:.7; }
    .content { padding:16px; }
    .empty { text-align:center; color:#94a3b8; font-size:12px; padding:20px 0; }
    .verdict { border-radius:10px; padding:14px; margin-bottom:12px; }
    .verdict.low { border:1px solid #bbf7d0; background:#f0fdf4; }
    .verdict.medium { border:1px solid #fde68a; background:#fffbeb; }
    .verdict.high { border:1px solid #fecaca; background:#fef2f2; }
    .level-row { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
    .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
    .dot.low { background:#22c55e; } .dot.medium { background:#f59e0b; } .dot.high { background:#ef4444; }
    .badge { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; }
    .badge.low { color:#16a34a; } .badge.medium { color:#d97706; } .badge.high { color:#dc2626; }
    .risk { font-size:30px; font-weight:800; line-height:1; } .risk small { font-size:14px; font-weight:500; }
    .risk.low { color:#16a34a; } .risk.medium { color:#d97706; } .risk.high { color:#dc2626; }
    .label { font-size:13px; font-weight:700; margin-top:4px; }
    .summary { font-size:11px; color:#64748b; margin-top:6px; line-height:1.5; }
    .action { background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px; margin-bottom:10px; }
    .action h3 { font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
    .action p { font-size:11px; color:#334155; line-height:1.5; }
    .muted { font-size:10px; color:#94a3b8; }
    hr { border:none; border-top:1px solid #e2e8f0; margin:10px 0; }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size:18px;">🛡️</span>
    <div>
      <h1>TrustShield</h1>
      <div class="sub">SEBI Verification Protocol</div>
    </div>
  </div>
  <div class="content">
    <div class="empty" id="empty">Open an email or message and click the floating 🛡️ button to analyze it.</div>
    <div id="result"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
